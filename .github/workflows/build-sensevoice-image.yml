name: Build SenseVoice image

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "infra/images/sensevoice/**"
      - ".github/workflows/build-sensevoice-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/images/sensevoice
          push: true
          tags: |
            ghcr.io/lee-kyungjae/gahyeonbot:sensevoice-latest
            ghcr.io/lee-kyungjae/gahyeonbot:sensevoice-${{ github.sha }}
          cache-from: type=gha,scope=sensevoice-cpu
          cache-to: type=gha,mode=max,scope=sensevoice-cpu
