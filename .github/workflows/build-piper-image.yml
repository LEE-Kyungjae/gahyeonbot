name: Build Piper TTS image

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - infra/images/piper/**
      - .github/workflows/build-piper-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/images/piper
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/lee-kyungjae/gahyeonbot:piper-latest
            ghcr.io/lee-kyungjae/gahyeonbot:piper-${{ github.sha }}
          cache-from: type=gha,scope=piper-tts
          cache-to: type=gha,mode=max,scope=piper-tts
      - name: Keep container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /user/packages/container/gahyeonbot -f visibility=public
